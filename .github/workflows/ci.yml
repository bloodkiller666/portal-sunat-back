name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

# Un push nuevo cancela la ejecución anterior de la misma rama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Lint y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar uv (lee .python-version)
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --frozen

      - name: Lint (ruff)
        run: uv run ruff check

      - name: Pruebas (sin red y sin Postgres)
        run: uv run pytest -q

  imagen:
    name: Construir la imagen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Garantiza que el Dockerfile de producción siga construyendo.
      - name: docker build
        run: docker build -t portal-facturacion:ci .
