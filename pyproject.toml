[project]
name = "factura-sunat-backend"
version = "0.1.0"
description = "Backend del Portal de Facturación Electrónica (SUNAT SEE, integración directa sin terceros)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "asyncpg>=0.30.0",
    "zeep>=4.3.0",
    "lxml>=5.3.0",
    "signxml>=4.0.0",
    "cryptography>=43.0.0",
    "pyjwt[crypto]>=2.9.0",
    "aioboto3>=12.0.0",
    "fpdf2>=2.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.21.1",
    "ruff>=0.7.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ASYNC"]
# B008: FastAPI depende de llamadas (Depends/Query) en los valores por defecto.
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
